name: Android

on:
  push:
    branches: ["**"]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    name: Unit tests and debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run unit tests
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest --no-daemon --console=plain --stacktrace 2>&1 | tee /tmp/test.log

      - name: Build debug APK
        if: success()
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --console=plain --stacktrace 2>&1 | tee /tmp/assemble.log

      - name: Diagnostics on failure
        if: failure()
        run: |
          python3 - <<'PY'
          import os, urllib.parse
          text = ""
          for path in ("/tmp/test.log", "/tmp/assemble.log"):
              if os.path.exists(path):
                  text += open(path, encoding="utf-8", errors="replace").read()
          if not text:
              text = "no gradle log was produced"
          tail = text[-7000:]
          print("::error title=build-log::" + urllib.parse.quote(tail, safe="/.,:=_-()[]{}<>'\" "))
          PY

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sudoku-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: android/app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
