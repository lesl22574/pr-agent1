apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    compileSdk 31

    defaultConfig {
        applicationId 'com.littlelogic.sudoku'
        minSdk 21
        targetSdk 31
        versionCode 1
        versionName '1.0.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    // Compose Compiler 1.0.5 is the release paired with Kotlin 1.5.31.
    composeOptions {
        kotlinCompilerExtensionVersion = '1.0.5'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    // Yandex Mobile Ads SDK 5.0.0: sticky banner at the bottom + interstitial between levels.
    // This release is built with Kotlin 1.5.10 and matches AGP 7.0 / compileSdk 31.
    implementation 'com.yandex.android:mobileads:5.0.0'

    implementation 'androidx.core:core-ktx:1.6.0'
    implementation 'androidx.activity:activity-compose:1.3.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.3.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.3.1'

    // Jetpack Compose 1.0.5 (Material 2), aligned with the Compose Compiler above.
    implementation 'androidx.compose.ui:ui:1.0.5'
    implementation 'androidx.compose.ui:ui-tooling-preview:1.0.5'
    implementation 'androidx.compose.material:material:1.0.5'
    debugImplementation 'androidx.compose.ui:ui-tooling:1.0.5'

    testImplementation 'junit:junit:4.13.2'
}
