// Native Android build for the Sudoku game.
// Toolchain for Android Studio 2020.3.1 / 2021: Gradle 7.0.2, AGP 7.0.4, Kotlin 1.5.31, JDK 11.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.0.4'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.5.31'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
