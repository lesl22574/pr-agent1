<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Азбука — изучение букв</title>
  <!-- SDK Яндекс Игр (GameReady) -->
  <script defer src="https://yandex.ru/games/sdk/v2"></script>
  <link rel="preload" href="assets/fonts/frankc.woff2?v=2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css?v=6">
  <link rel="stylesheet" href="css/input-guard.css?v=1">
</head>
<body>
  <div id="bg" aria-hidden="true"></div>
  <audio id="menuMusic" src="assets/audio/Veselaya_karusel.mp3" preload="none" loop></audio>
  <div id="fireworks" class="hidden" role="status" aria-label="Салют за правильный ответ">
    <div id="fireworksParticles" aria-hidden="true"></div>
  </div>
  <audio id="fireworksAudio" preload="none" loop></audio>
  <div id="stage">

    <!-- ===== Режим 1: выбор карточки с буквой ===== -->
    <div id="game" class="screen hidden">
      <div id="count" class="count"></div>

      <div id="board">
        <div id="pic" class="pic"></div>
        <div id="letter" class="letter"></div>
      </div>

      <div id="tiger" class="tiger">🐯</div>

      <div id="cards"></div>
    </div>

    <!-- ===== Закрепление: лопаем шарики с буквой ===== -->
    <div id="pop" class="screen hidden">
      <div class="popSign">
        <span class="popHint">Лопни букву</span>
        <span id="popTarget" class="popTarget"></span>
      </div>
    </div>

    <!-- ===== Режим 2: чтение слов ===== -->
    <div id="read" class="screen hidden">
      <div id="readCount" class="count"></div>
      <div id="readBoard" class="readBoard"></div>
      <div id="readLayer"></div>
    </div>

    <!-- ===== Кнопки и настройки (видны в игре) ===== -->
    <div id="hud" class="screen hidden">
      <button id="btnSettings" class="round tl" title="Настройки">⚙</button>
      <button id="btnHome" class="round tr" title="В меню" aria-label="В меню">
        <img id="homeIcon" src="assets/img/btn-home.png" alt="" draggable="false">
        <span class="homeFallback" aria-hidden="true">⌂</span>
      </button>

      <div id="settings" class="panel hidden">
        <h3>Настройки</h3>
        <button id="btnSound" class="btn small">Звук: вкл</button>
        <button id="btnReset" class="btn small">Сбросить прогресс</button>
        <button id="btnCloseSettings" class="btn small">Закрыть</button>
      </div>
    </div>

    <!-- ===== Стартовый экран ===== -->
    <div id="start" class="screen overlay">
      <button id="btnLaunch" class="candy launch">Играть</button>
      <label class="candy treats"><input id="treats" type="checkbox"> Вкусности</label>
      <div id="treatsInfo" class="treatsInfo">Вкусности: буквы по порядку. Без галочки — случайные буквы.</div>
      <div class="modeMenu" role="group" aria-label="Выбор занятия">
        <button id="btnPlay" class="candy selected" aria-pressed="true">Изучение букв</button>
        <button id="btnWipe" class="candy" aria-pressed="false">Рисование букв</button>
        <button id="btnRead" class="candy" aria-pressed="false">Чтение</button>
      </div>
      <button id="btnRestart" class="btn small restart hidden">Буквы: начать сначала</button>
    </div>

    <iframe id="wipe" class="screen hidden" title="Вытри букву полотенцем"></iframe>

    <!-- ===== Финальный экран ===== -->
    <div id="end" class="screen overlay hidden">
      <div class="title">Ура!</div>
      <div id="endSub" class="subtitle">Ты выучил все буквы!</div>
      <div class="tigerBig">🐯</div>
      <div class="menu">
        <button id="btnEndAgain" class="btn big">Играть сначала</button>
      </div>
    </div>
  </div>

  <script defer src="js/input-guard.js?v=1"></script>
  <script defer src="js/background-preload.js?v=1"></script>
  <script defer src="js/settings.js?v=20261123-fireworks"></script>
  <script defer src="js/levels.js?v=20261123-mp3"></script>
  <script defer src="js/game.js?v=20261123-background-preload"></script>
</body>
</html>
